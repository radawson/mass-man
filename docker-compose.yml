services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: massman
      POSTGRES_USER: massman
      POSTGRES_PASSWORD: PASSword01!!
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massman -d massman"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
