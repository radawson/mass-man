# Nginx configuration for mass.partridgecrossing.org
# This server receives traffic from HAProxy at 10.10.13.1.
# real_ip_* is already set in /etc/nginx/nginx.conf.

upstream massman_backend {
    server 127.0.0.1:3004;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    server_name mass.partridgecrossing.org;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/massman_access.log;
    error_log /var/log/nginx/massman_error.log;

    client_max_body_size 10M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://massman_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Ssl $https;
        proxy_cache_bypass $http_upgrade;
    }

    location /_next/static {
        proxy_pass http://massman_backend;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, immutable";
    }
}
